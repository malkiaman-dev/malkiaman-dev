<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Malki Aman, Data Analyst, AI Automation Engineer, Web Solutions Engineer</title>
  <desc id="d">Banner reading Malki Aman, Data Analyst, AI Automation Engineer and Web Solutions Engineer, Islamabad, Pakistan, with a small pipeline diagram of data being collected, validated and automated.</desc>
  <defs>
