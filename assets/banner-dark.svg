      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.25"/>
