    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="16" fill="#0d1117"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="16" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#30363d"/>

  <rect x="72" y="88" width="6" height="144" rx="3" fill="url(#accent)"/>
  <text x="104" y="146" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">Malki Aman</text>
  <text x="106" y="190" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#c9d1d9">Data Analyst · AI Automation Engineer · Web Solutions Engineer</text>
  <text x="106" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8b949e">Python · SQL · Power BI · n8n · React · FastAPI  ·  Islamabad, PK</text>

  <!-- pipeline: collect, validate, automate -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b949e" text-anchor="middle">
    <path d="M940 160H1012M1088 160H1160" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(902 160)">
